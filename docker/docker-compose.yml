services:
  code-relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: code-relay
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8087}:8087"
    environment:
      # 服务端口
      - SERVER_PORT=${SERVER_PORT:-8087}

      # 数据库配置
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST:-a806698083.ticp.io}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-codex_rental}?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-aaop77439la}

      # Redis 配置
      - SPRING_REDIS_HOST=${REDIS_HOST:-a806698083.ticp.io}
      - SPRING_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-31897197%12312A}
      - SPRING_REDIS_DB=0

      # 管理员密码
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}

      # 应用名称
      - SPRING_APPLICATION_NAME=code-relay

      # 时区
      - TZ=Asia/Shanghai

    volumes:
      # 日志持久化
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/api/internal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 资源限制（根据系统自动调整）
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
